<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CaféMenu Admin</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="login"><div class="box"><div class="logo">☕</div><h1>CaféMenu</h1><p>تسجيل دخول لوحة التحكم</p><form id="loginForm"><input id="email" type="email" placeholder="البريد الإلكتروني" required><input id="password" type="password" placeholder="كلمة المرور" required><button>دخول</button><div id="err"></div></form></div></div>
<div id="app" class="hidden"><aside><h2>☕ CaféMenu</h2><button class="nav active" data-page="dashboard">📊 الرئيسية</button><button class="nav" data-page="categories">📂 الأقسام</button><button class="nav" data-page="products">🍔 الأصناف</button><button class="nav" data-page="settings">⚙️ الإعدادات</button><button id="logout" class="logout">تسجيل الخروج</button></aside><main><header><div><small>لوحة التحكم</small><h1 id="title">الرئيسية</h1></div><a href="../" target="_blank">👁️ عرض المنيو</a></header>
<section id="dashboard" class="page"><div class="stats"><div>📂<b id="sc">0</b><small>الأقسام</small></div><div>🍔<b id="sp">0</b><small>الأصناف</small></div><div>🟢<b id="sa">0</b><small>متوفر</small></div><div>⭐<b id="sf">0</b><small>مميز</small></div></div></section>
<section id="categories" class="page hidden"><div class="bar"><div><h2>الأقسام</h2><p>إضافة وتعديل وحذف الأقسام وصورها.</p></div><button onclick="categoryModal()">+ إضافة قسم</button></div><div id="catGrid" class="grid"></div></section>
<section id="products" class="page hidden"><div class="bar"><div><h2>الأصناف</h2><p>إضافة صورة، سعر، وصف، قسم وحالة الصنف.</p></div><button onclick="productModal()">+ إضافة صنف</button></div><div id="prodGrid" class="grid"></div></section>
<section id="settings" class="page hidden"><div class="panel"><h2>إعدادات المطعم</h2><form id="settingsForm"><label>اسم المطعم<input id="rname"></label><label>WhatsApp<input id="wa"></label><label>الهاتف<input id="phone"></label><label>العنوان<input id="address"></label><label>ساعات العمل<input id="hours"></label><button>حفظ</button></form></div></section>
</main></div>
<div id="modal" class="modal hidden"><div class="modalbox"><button class="x" onclick="closeModal()">×</button><h2 id="mtitle"></h2><form id="form"></form></div></div>
<script type="module" src="app.js"></script></body></html>
